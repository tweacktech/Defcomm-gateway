# ─── Network ──────────────────────────────────────────────────────────────────
# Coturn runs with network_mode: host so it sees the real interfaces.
# On production: set EXTERNAL_IP to your real public IP in .env
# On local:      set EXTERNAL_IP to your LAN IP (e.g. 192.168.1.x)

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0 

# External IP is read from environment — set in .env
# Production: TURN_EXTERNAL_IP=173.249.22.187
# Local:      TURN_EXTERNAL_IP=192.168.1.x
external-ip=${TURN_EXTERNAL_IP}
3 w
# ─── Relay port range ─────────────────────────────────────────────────────────
min-port=49152
max-port=65535

# ─── Auth ─────────────────────────────────────────────────────────────────────
realm=${TURN_REALM}
server-name=${TURN_REALM}
fingerprint
lt-cred-mech
user=${TURN_USERNAME}:${TURN_PASSWORD}

# ─── TLS (production only) ────────────────────────────────────────────────────
# Comment these out for local development if you have no certs
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# ─── Logging ──────────────────────────────────────────────────────────────────
log-file=stdout
simple-log
verbose

# ─── Security ─────────────────────────────────────────────────────────────────
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
