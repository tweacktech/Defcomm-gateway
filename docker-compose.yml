# version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defcomm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - redis
      - db
    networks:
      - defcomm

  nginx:
    image: nginx:alpine
    container_name: defcomm_nginx
    restart: unless-stopped
    ports:
       - "8080:80"
       - "8443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - defcomm

  db:
    image: mysql:8.0
    container_name: defcomm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: defcomm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: defcomm
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - defcomm

  redis:
    image: redis:alpine
    container_name: defcomm_redis
    ports:
      - "6379:6379"
    networks:
      - defcomm

  coturn:
    image: coturn/coturn
    container_name: defcomm_turn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command: >
      -n
      --log-file=stdout
      --min-port=49160
      --max-port=49200
      --realm=defcomm.local
      --user=user:pass
      --lt-cred-mech
    networks:
      - defcomm

networks:
  defcomm:

volumes:
  dbdata:

