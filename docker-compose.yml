version: "3.9"

services:
  coturn:
    image: coturn/coturn:latest
    container_name: defcomm_turn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49300:49152-49300/udp"
    volumes:
      - ./coturn/turnserver.local.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      test: ["CMD-SHELL", "nc -zu 127.0.0.1 3478 && echo ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
