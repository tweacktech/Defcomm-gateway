version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defcomm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - redis
      - db
    networks:
      - defcomm

  nginx:
    image: nginx:alpine
    container_name: defcomm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - defcomm

  db:
    image: mysql:8.0
    container_name: defcomm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: defcomm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: defcomm
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - defcomm

  redis:
    image: redis:alpine
    container_name: defcomm_redis
    ports:
      - "6379:6379"
    networks:
      - defcomm

  coturn:
    image: coturn/coturn
    container_name: defcomm_turn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command: >
      -n
      --log-file=stdout
      --min-port=49160
      --max-port=49200
      --realm=defcomm.local
      --user=user:pass
      --lt-cred-mech
    networks:
      - defcomm

networks:
  defcomm:

volumes:
  dbdata:
---
# ================= DOCKERFILE =================

FROM php:8.3-fpm

# Install system dependencies
RUN apt-get update && apt-get install -y \
    git \
    curl \
    libpng-dev \
    libonig-dev \
    libxml2-dev \
    zip \
    unzip \
    nodejs \
    npm \
    python3 \
    python3-pip

# Install PHP extensions
RUN docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd

# Install Composer
COPY --from=composer:latest /usr/bin/composer /usr/bin/composer

WORKDIR /var/www

# Copy project
COPY . .

# Install dependencies
RUN composer install
RUN npm install && npm run build

# Permissions
RUN chown -R www-data:www-data /var/www

EXPOSE 9000

CMD ["php-fpm"]

---
# ================= NGINX CONFIG =================

server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
